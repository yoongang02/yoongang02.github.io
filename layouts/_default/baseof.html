<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default `en` }}" class="scroll-smooth dark">
  <head>
    {{- partial "head/index" . -}}
    {{- partial "head/ui-system" . -}}
  </head>

  <body class="mx-auto px-2.5" style="max-width:960px;">
    <div class="header">
      {{ partial "header/index" . }}
      {{ partial "header/theme-button" . }}
    </div>

    <main id="content">
      {{- block "main" . -}}
      {{- end }}
    </main>

    {{- partial "footer/index" . -}}
  </body>
</html>
