{{ $paginator := .Paginator }}

<nav class="post-pagination" aria-label="게시글 페이지 이동">
  {{ if $paginator.HasPrev }}
    <a
      href="{{ $paginator.Prev.URL }}"
      class="post-pagination-button is-active"
      aria-label="이전 페이지"
    >
      <span aria-hidden="true">{{ partial "utils/icon" "chevron-left" }}</span>
    </a>
  {{ else }}
    <span class="post-pagination-button is-disabled" aria-label="이전 페이지 없음" aria-disabled="true">
      <span aria-hidden="true">{{ partial "utils/icon" "chevron-left" }}</span>
    </span>
  {{ end }}

  {{ if $paginator.HasNext }}
    <a
      href="{{ $paginator.Next.URL }}"
      class="post-pagination-button is-active"
      aria-label="다음 페이지"
    >
      <span aria-hidden="true">{{ partial "utils/icon" "chevron-right" }}</span>
    </a>
  {{ else }}
    <span class="post-pagination-button is-disabled" aria-label="다음 페이지 없음" aria-disabled="true">
      <span aria-hidden="true">{{ partial "utils/icon" "chevron-right" }}</span>
    </span>
  {{ end }}
</nav>

<style>
  .post-pagination {
    display: flex;
    padding-bottom: 40px;
    align-items: center;
    justify-content: space-between;
  }

  #content .post-pagination-button {
    display: flex;
    width: 44px;
    height: 44px;
    align-items: center;
    justify-content: center;
    border: 1px solid rgb(31 41 55);
    text-decoration: none;
  }

  .post-pagination-button span {
    display: block;
    width: 22px;
    height: 22px;
  }

  .post-pagination-button:first-child span {
    transform: translateX(-1px);
  }

  .post-pagination-button:last-child span {
    transform: translateX(1px);
  }

  #content .post-pagination-button.is-active {
    color: white;
    background: rgb(31 41 55);
  }

  #content .post-pagination-button.is-active:hover {
    color: white;
    background: rgb(55 65 81);
  }

  #content .post-pagination-button.is-disabled {
    color: rgb(31 41 55);
    background: white;
    cursor: default;
  }

  .dark #content .post-pagination-button {
    border-color: rgb(229 231 235);
  }

  .dark #content .post-pagination-button.is-active {
    color: rgb(17 24 39);
    background: rgb(229 231 235);
  }

  .dark #content .post-pagination-button.is-active:hover {
    background: white;
  }

  .dark #content .post-pagination-button.is-disabled {
    color: rgb(229 231 235);
    background: rgb(17 24 39);
  }
</style>
