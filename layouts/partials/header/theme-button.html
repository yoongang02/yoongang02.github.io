<button class="toggle-theme" type="button" aria-label="다크 모드로 전환" title="다크 모드로 전환" data-theme-toggle>
  <span class="theme-icon light"> {{ partial "utils/icon" "sun" }} </span>
  <span class="theme-icon dark"> {{ partial "utils/icon" "moon" }} </span>
</button>

{{- $themeScript := resources.Get "js/theme.js" | minify | fingerprint -}}
<script defer src="{{ $themeScript.RelPermalink }}" integrity="{{ $themeScript.Data.Integrity }}"></script>
